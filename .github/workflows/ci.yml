name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Create venv and install
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"
      - name: Check generated dataset is in sync with raw sources
        run: uv run python scripts/build_dataset.py --check
      - name: Run offline tests
        run: uv run pytest -q
      - name: Build wheel
        run: uv build
      - name: Smoke-test the wheel from another directory
        run: |
          uv venv .wheel-venv
          uv pip install --python .wheel-venv/bin/python dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/.wheel-venv/bin/tugas" list
