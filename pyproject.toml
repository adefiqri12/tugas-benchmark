[project]
name = "indo-eval"
version = "0.1.0"
description = "Evaluation harness + leaderboard for AI agents (tool-calling) in Bahasa Indonesia."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
indoeval = "indoeval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indoeval"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
