[project]
name = "tugas"
version = "0.1.10"
description = "TUGAS (Tool-Use and Grounded Agent Score) — a tool-calling agent benchmark for Bahasa Indonesia."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ade Fiqri", email = "adefiqri12@users.noreply.github.com" }]
keywords = [
    "benchmark",
    "evaluation",
    "llm",
    "agents",
    "tool-calling",
    "indonesian",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
tugas = "tugas.cli:app"

[project.urls]
Homepage = "https://github.com/adefiqri12/tugas-benchmark"
Repository = "https://github.com/adefiqri12/tugas-benchmark"
Issues = "https://github.com/adefiqri12/tugas-benchmark/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tugas"]

# Keep the raw, hand-authored sources and the build script in the source
# distribution so contributors can regenerate the dataset from an sdist.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/eval",
    "/scripts",
    "/tests",
    "/README.md",
    "/AGENTS.md",
    "/LICENSE",
]

# Ship the canonical golden dataset inside the wheel so an installed `tugas`
# can locate it from any working directory (see tugas.cli.default_tasks_path).
[tool.hatch.build.targets.wheel.force-include]
"eval/datasets/golden_id.json" = "tugas/data/golden_id.json"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
