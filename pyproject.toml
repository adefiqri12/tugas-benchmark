[project]
name = "tugas"
version = "0.1.0"
description = "TUGAS (Tool-Use and Grounded Agent Score) — benchmark + leaderboard for tool-calling AI agents in Bahasa Indonesia."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
tugas = "tugas.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tugas"]

# Ship the canonical golden dataset inside the wheel so an installed `tugas`
# can locate it from any working directory (see tugas.cli.default_tasks_path).
[tool.hatch.build.targets.wheel.force-include]
"eval/datasets/golden_id.json" = "tugas/data/golden_id.json"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
